# Series are first-class entities, not tags on events.
#
# `covers` is a LIST of in-universe spans, because coverage is frequently
# non-contiguous: framing devices, flashback arcs, and epilogues all leave
# gaps. A single start/end pair would draw Unicorn as a 95-year bar because
# of one prologue scene, which is wrong and looks wrong.
#
# Each span carries `weight`:
#   main      the bulk of the narrative
#   prologue  framing or opening material set well outside the main span
#   flashback backfill within an otherwise later narrative
#   epilogue  closing material after the main span
# Renderers should draw `main` solid and everything else hairline or dashed.
#
# `release_year` is real-world; `covers` is in-universe. Keeping both lets
# you sort a shelf by publication order and a chart by chronology, and
# makes retcon direction visible: a later release covering an earlier span
# is where contradictions live.

series:
  - id: ser.uc.origin
    title: "Mobile Suit Gundam: The Origin"
    timeline: tl.uc
    source: src.uc.origin
    release_year: 2001
    format: manga
    covers:
      - start: "0068"
        end: "0079.12"
        weight: main
    focus: >
      The origins of the Zabi regime and of Casval Rem Deikun. It retells
      the opening of the One Year War from the Zeon side.

  - id: ser.uc.origin-anime
    title: "Mobile Suit Gundam: The Origin (Advent of the Red Comet)"
