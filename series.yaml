  # ---------------------------------------------------------------------
  # Mars Century, the Build continuity, and SD Gundam.
  #
  # Two schema features earn their keep below. ser.mc.frozen-teardrop uses
  # per-span `timeline` — its main narrative is Mars Century and its
  # flashbacks are After Colony, and no single era describes the work. The
  # Build and SD entries use `undated` spans, because those continuities
  # supply no calendar to have a span in.
  # ---------------------------------------------------------------------

  - id: ser.mc.frozen-teardrop
    title: "New Mobile Report Gundam Wing: Frozen Teardrop"
    timeline: tl.mc
    source: src.mc.frozen-teardrop
    release_year: 2010
    format: novel
    covers:
      - start: "0022"
        end: "0022"
        weight: main
        confidence: approximate
      - start: "0195"
        end: "0196"
        timeline: tl.ac
        weight: flashback
        confidence: needs-verification
        note: >
          A span in a DIFFERENT era from the era of the series itself. The
          flashback arcs of the novel sit in After Colony. Its present
          sits in Mars Century. Before `coverageSpan.timeline` existed,
          there were two options: drop the flashbacks, or move the whole
          work into AC. The first loses half the book. The second files a
          Mars Century work under the wrong era on every render. The AC
          bounds here are the weakest figure in the entry. Some
          chronologies run After Colony to AC 0197 and put part of this
          material there. The range 0195-0196 is what this dataset can
          support without inventing, so it carries needs-verification.
    focus: >
      The After Colony cast, decades later, on a terraformed Mars. Their
      calendar runs at half the speed of the one they grew up with.
    note: >
      Read the epoch note on tl.mc before you compute anything from this
      entry. MC 0022 falls near AC 0226, not AC 0204. The eras differ by a
      rate as well as an offset, and the schema holds no rate.

