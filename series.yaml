          It carried a needs-verification flag, and the check found
          nothing to support it. The only post-war arc that can be dated
          is set in July UC 0080, already inside this span. Later arcs are
          uncatalogued rather than absent. Add a span when somebody reads
          one, not before.
    focus: >
      The Thunderbolt Sector debris field. Later arcs move past the war.
    note: >
      The author states that the history of this work differs from the
      official chronology. This dataset files it under tl.uc, because
      publishers and readers treat it as UC. It is still the strongest
