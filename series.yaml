        weight: main
    focus: >
      The prototype for everything below. A Gunpla battle tournament and
      nothing more.

  - id: ser.build.build-fighters
    title: Gundam Build Fighters
    timeline: tl.build
    source: src.build.build-fighters
    release_year: 2013
    format: tv
    covers:
      - undated: true
        weight: main
        note: >
          The work states no date, in any form, anywhere. This is the
          first `undated` coverage span in the dataset, and it is not a
          gap to fill later. The continuity has no calendar, so there is
          nothing to enter. A render must place these outside the time
          axis, not at its origin.
    focus: >
      A model-building tournament in a near-present real world. Every
      other continuity in this dataset exists there as fiction.

  - id: ser.build.build-fighters-try
