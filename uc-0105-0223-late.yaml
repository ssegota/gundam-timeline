# UC 0105 onward: the late era.
#
# Coverage thins sharply after 0100 and the gaps become structural rather
# than incidental — the thirty years between 0093 and 0123 contain one
# major work. Do not paper over this. A linear render should show the
# sparseness, because the sparseness is the accurate picture.

events:
  - id: evt.uc.0105.mafty-insurgency
    label: Mafty insurgency
    type: war
    timeline: tl.uc
    date:
      - start: "0105"
        sources: [src.uc.hathaway-novel]
    participants: [fac.uc.mafty, fac.uc.efed]
    summary: >
      An armed movement runs a campaign of targeted assassination against
      Federation officials, over the forced move of Earth's population to
      the colonies. Its leader is the son of a decorated Federation
      officer from the One Year War.
    depicted_in: [ser.uc.hathaway]
    claims:
      - property: adaptation_note
        value: >
          The novel and the film adaptation differ in emphasis and in
          detail.
        sources: [src.uc.hathaway-novel, src.uc.hathaway]
        confidence: editorial

  - id: evt.uc.0123.cosmo-babylonia-war
    label: Cosmo Babylonia War
    type: war
    timeline: tl.uc
    date:
      - start: "0123"
        sources: [src.uc.f91]
    participants: [fac.uc.crossbone-vanguard, fac.uc.efed]
    summary: >
      The Crossbone Vanguard acts for an aristocratic faction and seizes a
      Side 4 colony. It aims to found a new space state led by nobles. The
      Federation answers slowly and with little effect.
    depicted_in: [ser.uc.f91]
    claims:
      - property: era_context
        value: >
          Mobile suits in this period are much smaller and faster than
          those of the Char era. A generation of postwar miniaturization
          stands between them.
        sources: [src.uc.f91]
    note: >
      About thirty years after the previous entry. It is the largest gap
      in the UC spine, and the most visible feature of any linear view.

  - id: evt.uc.0133.jupiter-conflict
    label: Jupiter Empire conflict
    type: war
    timeline: tl.uc
    date:
      - start: "0133"
        sources: [src.uc.crossbone]
        confidence: certain
      - anchor:
          relative_to: evt.uc.0123.cosmo-babylonia-war
          offset_years: 10
          direction: after
        sources: [src.uc.crossbone]
        confidence: approximate
        note: >
          The same source also dates this event relatively, at roughly a
          decade after the previous war. This second claim exercises
          relative anchoring. The ingest step resolves it against the
          target event, and it should agree with the absolute claim above.
          If the two ever disagree, that is a data error worth showing.
    participants: [fac.uc.jupiter-empire, fac.uc.crossbone-vanguard]
    summary: >
      A militarized state grows out of the Jovian resource fleets and
      moves against the Earth Sphere. A remnant of the Crossbone Vanguard,
      now working as privateers, opposes it.
    depicted_in: [ser.uc.crossbone]

  - id: evt.uc.0153.zanscare-war
    label: Zanscare war
    type: war
    timeline: tl.uc
    date:
      - start: "0153"
        sources: [src.uc.victory]
    participants: [fac.uc.zanscare, fac.uc.league-militaire, fac.uc.efed]
    summary: >
      The Zanscare Empire invades Earth from Side 2. A civilian militia
      carries most of the defense. By this point the Federation military
      can barely answer at all.
    depicted_in: [ser.uc.victory]
    claims:
      - property: federation_status
        value: >
          The Federation survives as an institution but no longer works as
          a military power. The preceding sixty years of entries trace
          that decline.
        sources: [src.uc.victory]

  - id: evt.uc.0136.jupiter-remnant
    label: The last Jupiter weapon
    type: battle
    timeline: tl.uc
    date:
      - start: "0136"
        sources: [src.uc.crossbone-steel7]
        confidence: needs-verification
    participants: [fac.uc.crossbone-vanguard, fac.uc.jupiter-empire]
    summary: >
      Three years after the Jupiter conflict, a weapon built by the
      losing side is still running. A small crew goes out to end it.
    depicted_in: [ser.uc.crossbone-steel7, ser.uc.crossbone-skull-heart]
    related: [evt.uc.0133.jupiter-conflict]

  - id: evt.uc.0169.dust-conflict
    label: Fighting over an abandoned Earth
    type: war
    timeline: tl.uc
    date:
      - start: "0169"
        sources: [src.uc.crossbone-dust]
        confidence: needs-verification
    summary: >
      Sixteen years after the Zanscare war, Earth has been written off
      again. What is left of the population fights over what is left of
      the planet.
    depicted_in: [ser.uc.crossbone-dust]
    related: [evt.uc.0153.zanscare-war]

  - id: evt.uc.0203.metatron-resistance
    label: The Man Hunting campaign
    type: war
    timeline: tl.uc
    date:
      - start: "0203"
        sources: [src.uc.gaia-gear]
        confidence: needs-verification
    participants: [fac.uc.metatron, fac.uc.man-hunting]
    summary: >
      The Federation forces Earth's remaining population back into
      space, and a resistance movement forms around a man who carries
      Char Aznable's genes.
    depicted_in: [ser.uc.gaia-gear]
    note: >
      From a work its rights holder has since disowned. Kept because it
      is published and read, and flagged so nobody mistakes it for
      settled ground.

  - id: evt.uc.0223.consent-conflict
    label: The settlements break from Earth
    type: war
    timeline: tl.uc
    date:
      - start: "0223"
        sources: [src.uc.g-saviour]
        confidence: needs-verification
    participants: [fac.uc.consent, fac.uc.freedom-league]
    summary: >
      The Earth Federation has collapsed. The space settlements govern
      themselves, and two blocs form. A food crisis on Earth turns the
      split into a war.
    depicted_in: [ser.uc.g-saviour]
