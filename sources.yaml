  # ---------------------------------------------------------------------
  # Mars Century, the Build continuity, and SD Gundam.
  #
  # Note what happens to the tier scale here. Every source above is a
  # broadcast, film, OVA or manga and the ordering never had to arbitrate.
  # These do not fit as cleanly: a novel that is the sole text of its era
  # sits at tier 3 beneath adaptations of other eras it has no relation to,
  # and an ONA aimed at children sits at tier 2 above it. The tiers are a
  # display convention rather than a canonicity ruling, which is exactly
  # what stops that being a claim about worth — but it is now visibly a
  # convention that was designed around the Universal Century's shelf.
  # ---------------------------------------------------------------------

