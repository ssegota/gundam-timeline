  - id: src.uc.chronology
    wiki: "https://gundam.fandom.com/wiki/Universal_Century"
    title: Universal Century supplementary chronology and technical material
    kind: reference
    tier: 4
    timeline: tl.uc
    confidence: needs-verification
    note: >
      One combined entry for the encyclopedia, mook and model-kit
      documentation that fixes most UC dates at day and month level. No
      narrative work states them. The 1979 series never gives a calendar
      date for the founding of the Republic of Zeon. Before the 2026-08
      pass, citing src.uc.msg-tv for such a date was the most common
      attribution error here. This is one source rather than many on
      purpose, because the individual publications cannot be told apart
      from the secondary compilations that repeat them. Split it as soon
      as somebody checks a specific volume. Everything credited here was
      checked against reference compilations, not against a primary
      publication. Hence the flag.
  # ---------------------------------------------------------------------
  # Independent continuities, in release order.
  #
  # Every primary text below is a television broadcast, so tier 1 covers
  # all of them and the tier ordering never has to arbitrate. That is luck,
  # not design: the moment a manga- or game-first continuity is catalogued,
  # a UC-shaped hierarchy that puts manga at tier 3 will rank that
  # continuity's own foundation text below its adaptations. See README.
  # ---------------------------------------------------------------------

