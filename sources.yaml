# Every claim in this dataset cites at least one source id from here.
#
# `tier` drives the default resolution policy (see README). It is a
# pragmatic ordering for picking a value to display, NOT a statement about
# which work is "better" or officially canon. Reasonable people order these
# differently; change the numbers and the whole dataset re-resolves.
#
# tier 1  theatrical film / TV broadcast, core spine
# tier 2  OVA and ONA
# tier 3  manga and novel, including retellings
# tier 4  games, model kit documentation, encyclopedias, magazine material

