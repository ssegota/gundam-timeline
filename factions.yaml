# Factions carry their own active spans so they can be rendered as a
# separate band beneath the event axis. Successor edges are what make the
# UC readable at a glance: the same grievance renames itself roughly every
# ten years, and drawing that chain explains more than any single event.

factions:
  - id: fac.uc.efed
    name: Earth Federation
    timeline: tl.uc
    active:
      start: "0001"
      confidence: editorial
      note: >
        This start is the calendar epoch, not the founding. The Federation
        predates the Universal Century, and its real founding year falls
        in the AD era. This schema cannot express that. Solve it before
        more continuities arrive, because several of them also hold
        institutions older than their own calendars. The Federation runs
        across the whole span. No source records a dissolution.

  - id: fac.uc.efsf
    name: Earth Federation Space Force
    timeline: tl.uc
    parent: fac.uc.efed
    active:
      start: "0070"
      confidence: approximate

  - id: fac.uc.republic-zeon
    name: Republic of Zeon
    timeline: tl.uc
    active:
      start: "0058.09.14"
      end: "0069.08.15"
      confidence: approximate
      note: >
        Corrected in the 2026-08 pass from 0069-0071. The Republic is
        Deikun's. He founded it a decade before his death, and the Zabis
        abolished it a year after. That is eleven years, not two. The old
        span made it a formality between the death and the Zabi monarchy.
    note: >
      Side 3 declared independence under Zeon Zum Deikun. A post-war state
      took the same name. That name collision needs explicit handling. Do
      not merge the two.

  - id: fac.uc.principality-zeon
    name: Principality of Zeon
    timeline: tl.uc
    active:
      start: "0069.08.15"
      end: "0080.01.01"
      confidence: approximate
    predecessor: fac.uc.republic-zeon

  - id: fac.uc.republic-zeon-2
    name: Republic of Zeon (post-war)
    timeline: tl.uc
    active:
      start: "0080.01.01"
      end: "0100"
      confidence: approximate
      note: >
        Added in the 2026-08 pass. The entry fac.uc.republic-zeon already
        carried a note that called the post-war republic a name collision
        to handle explicitly. The Treaty of Granada then pointed at the
        pre-war state anyway. The new faction-span rule caught it on the
        first run: a 0080 treaty signed by a state dissolved in 0069. The
        end year is when the Republic is said to have given up its
        autonomous rights. No work confirms it.
    predecessor: fac.uc.principality-zeon

  - id: fac.uc.delaz
    name: Delaz Fleet
    timeline: tl.uc
    active:
      start: "0080"
      end: "0083.11"
      confidence: approximate
    predecessor: fac.uc.principality-zeon

  - id: fac.uc.titans
    name: Titans
    timeline: tl.uc
    parent: fac.uc.efed
    active:
      start: "0083.12.04"
      end: "0088.02.22"
      confidence: approximate
      note: >
        Corrected in the 2026-08 pass from 0083.11-0087.02. The end date
        was the clearest internal contradiction here. The Titans appeared
        as dissolved in UC 0087 while still listed as a participant in a
        war that runs to UC 0088. The gryps-conclusion event in this same
        file says they were destroyed there. On any render the faction
        band would have stopped in the middle of the war.

  - id: fac.uc.aeug
    name: Anti-Earth Union Group
    timeline: tl.uc
    abbrev: AEUG
    active:
      start: "0085"
      end: "0089"
      confidence: approximate
      note: >
        End moved in the 2026-08 pass from 0088. The AEUG takes part in
        the First Neo Zeon War, which runs to 0089.01. The old end came
        before an event the faction is listed in. This is the same fault
        as the Titans above. A validator rule that compares faction spans
        against the events naming them catches both.

  - id: fac.uc.axis
    name: Axis Zeon
    timeline: tl.uc
    active:
      start: "0080"
      end: "0088"
      confidence: approximate
      note: >
        Start moved in the 2026-08 pass from 0086. Axis exists as a Zeon
        exile community from the end of the One Year War. In 0086 it
        fitted thrusters and began the voyage back, arriving 0087.10.12.
        Dating the faction from its departure erased the six years in
        which it became the thing that departed.
    predecessor: fac.uc.principality-zeon

  - id: fac.uc.neo-zeon-1
    name: Neo Zeon (First)
    timeline: tl.uc
    active:
      start: "0088"
      end: "0089.01"
      confidence: approximate
    predecessor: fac.uc.axis

  - id: fac.uc.neo-zeon-2
    name: Neo Zeon (Second)
    timeline: tl.uc
    active:
      start: "0092"
      end: "0093.03"
      confidence: approximate
    predecessor: fac.uc.neo-zeon-1
    note: >
      Char Aznable's organization. It is distinct from fac.uc.neo-zeon-1,
      despite the name.

  - id: fac.uc.sleeves
    name: The Sleeves
    timeline: tl.uc
    active:
      start: "0094"
      end: "0096"
      confidence: approximate
      note: >
        Corrected in the 2026-08 pass from 0090. The Sleeves are what
        remains after Char's defeat in 0093. A start of 0090 put them in
        the field two years before the founding of the organization they
        succeed. The faction began before its own predecessor. A validator
        rule that checks predecessor.start against successor.start catches
        this class directly. Nothing checks it today.
    predecessor: fac.uc.neo-zeon-2

  - id: fac.uc.londo-bell
    name: Londo Bell
    timeline: tl.uc
    parent: fac.uc.efed
    active:
      start: "0090"
      confidence: approximate

