# ---------------------------------------------------------------------
# Mars Century and SD Gundam.
#
# The Build continuity has NO factions and the omission is deliberate. Its
# events have no belligerents — they are tournaments and game sessions, and
# the organisations involved are a toy company and a game operator. An
# empty faction band there is accurate, not missing. If someone later adds
# `fac.build.*` for the corporations, the band will imply a conflict
# structure the works do not have.
# ---------------------------------------------------------------------

  - id: fac.mc.preventers
    name: Preventers
    timeline: tl.mc
    active:
      start: "0001"
      confidence: editorial
      note: >
        Founded in After Colony, not Mars Century, so this start uses the
        epoch of the wrong calendar. It is the least meaningful faction
        span here. It stays because the organization truly works in both
        eras, and because `active` has nowhere to hold an AC date on an MC
        faction. A faction that spans two eras is the entity-level version
        of the problem that `coverageSpan.timeline` solves for series.

  - id: fac.mc.mars-colonies
    name: Mars colonial administration
    timeline: tl.mc
    active:
      start: "0001"
      confidence: editorial

  - id: fac.sd-f.sdg
    name: Super Dimensional Guard
    abbrev: SDG
    timeline: tl.sd.force
    active:
      start: "0001"
      confidence: editorial
      note: >
        This start means nothing. The timeline tl.sd.force has no
        calendar, `active` needs an eraDate, and "0001" is the only
        literal that fits the pattern without asserting anything. A
        coverage span or a date claim can say `undated`. The `active`
        field cannot. That is the third schema hole of the same shape,
        left open rather than patched in the same pass.

  - id: fac.sd-f.dark-axis
    name: Dark Axis
    timeline: tl.sd.force
    active:
      start: "0001"
      confidence: editorial

  - id: fac.sd-w.kingdoms
    name: The Three Kingdoms
    timeline: tl.sd.world
    active:
      start: "0001"
      confidence: editorial
